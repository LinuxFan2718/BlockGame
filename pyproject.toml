[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "blokus-rl"
version = "0.1.0"
description = "Learn PyTorch and reinforcement learning with a Rust game engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.5,<3",
    "torchrl>=0.10,<0.15",
    "tensordict>=0.10,<0.15",
    "pettingzoo>=1.24,<2",
    "gymnasium>=1.0,<2",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
blokus-rl = "blokus_rl.cli:main"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "python"
module-name = "blokus_rl._native"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
